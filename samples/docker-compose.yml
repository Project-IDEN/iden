# The four sample applications — four because single-sign-out is two of them.
#
#   cp .env.example .env     # fill it in
#   docker compose up -d --build
#
#   Playground 5100 · Portal 5200 · Library 5201 · Next.js 5300
#
# Ports are published on every interface, so cloudflared or any other proxy can
# reach them at host.docker.internal:<port>. On a machine with a public address
# that is the internet too — firewall them if that matters.
#
# IDEN_ISSUER has to be a name your browser and these containers can both
# resolve, and has to match your deployment's own IDEN_ISSUER character for
# character. A public hostname is both; `localhost` is neither, because inside a
# container it is the container.

name: iden-samples

services:
  # No configuration: the issuer and every parameter are typed into the page.
  # It does need its origin in the provider's IDEN_ALLOWED_ADMIN_ORIGINS — the
  # only sample that calls IDEN from the browser rather than from a server.
  playground:
    build: ./oidc-playground
    ports:
      - "5100:5100"

  portal:
    build: ./single-sign-out
    environment:
      IDEN_ISSUER: ${IDEN_ISSUER:?set IDEN_ISSUER in samples/.env}
      APP: portal
      CLIENT_ID: ${PORTAL_CLIENT_ID:-demo-portal}
      # Where the browser reaches it. The redirect URI and the post-logout
      # redirect are built from this, and both are matched exactly.
      ORIGIN: ${PORTAL_ORIGIN:-http://localhost:5200}
      SIBLING_ORIGIN: ${LIBRARY_ORIGIN:-http://localhost:5201}
    ports:
      - "5200:5200"

  library:
    build: ./single-sign-out
    environment:
      IDEN_ISSUER: ${IDEN_ISSUER:?set IDEN_ISSUER in samples/.env}
      APP: library
      CLIENT_ID: ${LIBRARY_CLIENT_ID:-demo-library}
      ORIGIN: ${LIBRARY_ORIGIN:-http://localhost:5201}
      SIBLING_ORIGIN: ${PORTAL_ORIGIN:-http://localhost:5200}
    ports:
      - "5201:5201"

  nextjs:
    build: ./nextjs-nextauth
    environment:
      IDEN_ISSUER: ${IDEN_ISSUER:?set IDEN_ISSUER in samples/.env}
      IDEN_CLIENT_ID: ${NEXTJS_CLIENT_ID:-demo-nextjs}
      # The one confidential client here: Auth.js exchanges the code server side.
      IDEN_CLIENT_SECRET: ${NEXTJS_CLIENT_SECRET:?set NEXTJS_CLIENT_SECRET in samples/.env}
      # Signs Auth.js's own cookie. Nothing to do with IDEN.
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in samples/.env — openssl rand -base64 32}
      AUTH_URL: ${NEXTJS_ORIGIN:-http://localhost:5300}
    ports:
      - "5300:5300"

  # Access control, in two processes. The controller decides and the panel asks;
  # see door-access/README.md for the objects you must register first.
  door-api:
    build: ./door-access/api
    environment:
      IDEN_ISSUER: ${IDEN_ISSUER:?set IDEN_ISSUER in samples/.env}
      # Must equal the audience on the `door` resource API in your deployment.
      DOOR_AUDIENCE: ${DOOR_AUDIENCE:-https://api.example.org/door}
    ports:
      - "5400:5400"

  door-panel:
    build: ./door-access/panel
    environment:
      IDEN_ISSUER: ${IDEN_ISSUER:?set IDEN_ISSUER in samples/.env}
      DOOR_PANEL_CLIENT_ID: ${DOOR_PANEL_CLIENT_ID:-demo-door-panel}
      # Confidential: the panel exchanges the code server side.
      DOOR_PANEL_CLIENT_SECRET: ${DOOR_PANEL_CLIENT_SECRET:?set DOOR_PANEL_CLIENT_SECRET in samples/.env}
      DOOR_PANEL_ORIGIN: ${DOOR_PANEL_ORIGIN:-http://localhost:5401}
      # By service name, not through the host: these two share a network, and
      # localhost inside this container is this container.
      DOOR_API_ORIGIN: ${DOOR_API_ORIGIN:-http://door-api:5400}
    ports:
      - "5401:5401"
