[project]
name = "provider"
version = "1.0.0"
description = "IDEN Core Server"
readme = "README.md"
authors = [
    { name = "yephonekyaw", email = "yephonekyaw231202@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.162.2",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.33",
    "redis[hiredis]>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
]

[project.scripts]
provider = "provider.core.app:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "types-aioboto3[s3]>=15.5.0",
    "zensical>=0.1.0",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # The formatter owns line length. It will not split a long string or
    # comment, so E501 only ever reports lines ruff itself chose to leave.
    "E501",
    # `Depends(require_scope(...))` in a parameter default is the FastAPI
    # idiom. B008 exists to catch mutable defaults, which this is not.
    "B008",
]

[tool.pyright]
include = ["src", "tests", "scripts", "migrations"]
venvPath = "."
venv = ".venv"
# Declared rather than left to the default so an editor set to strict agrees
# with what CI checks. Strict is not a useful bar for a pytest suite: fixtures
# arrive as unannotated parameters, and one unknown type cascades through every
# use of it — roughly 2,000 findings that say nothing about the tests.
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
# So `scripts.seed` imports under pytest the same way it does under
# `uv run python -m scripts.seed`.
pythonpath = ["."]
asyncio_mode = "auto"
# Both are session-scoped so the session-scoped database engine and the tests
# that use it share one event loop; asyncpg connections cannot cross loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs the real biometric engine; skipped when it is unreachable",
]

[tool.coverage.run]
source = ["src/provider"]
# Not measured, and deliberately so: `migrations/` is generated and run by
# Alembic, and `tests/` measuring itself says nothing.
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
# Coverage is a gap-finding tool here, not a gate. A threshold that fails the
# build teaches people to write tests that touch lines rather than tests that
# check behaviour.
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
