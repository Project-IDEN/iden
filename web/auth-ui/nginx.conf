# The sign-in page, served from /auth/ so that one origin can carry the
# provider, this app and the dashboard. The files live under html/auth rather
# than being aliased there: URL and path then match segment for segment, which
# is one less thing to get wrong than an `alias` per location.
server {
  listen 4000;
  root /usr/share/nginx/html;

  # Hashed asset filenames, so they can be cached indefinitely.
  location /auth/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/conf.d/security-headers.inc;
  }

  # Written at container start, so one image serves any issuer.
  location = /auth/config.js {
    add_header Cache-Control "no-store";
    include /etc/nginx/conf.d/security-headers.inc;
  }

  # A single-page app: every path under /auth is the same document.
  location /auth/ {
    try_files $uri $uri/ /auth/index.html;
    add_header Cache-Control "no-store";
    include /etc/nginx/conf.d/security-headers.inc;
  }

  # The root is not this app's, but landing there and getting a 404 is a poor
  # welcome — and both the dev server and the production proxy redirect it. Match
  # them, so the same URL behaves the same way in all three.
  location = / {
    return 302 /auth/;
  }

  # Anything else genuinely is not this app's to answer. Without this, a stray
  # request would fall through to the root and 404 with nginx's own page; saying
  # so explicitly keeps the container honest when it is run on its own.
  location / {
    return 404;
  }
}
