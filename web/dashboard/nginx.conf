# Administration and self-service, served from /console/ so that one origin can
# carry the provider, the sign-in page and this app. Not the root: the
# provider's API owns /admin/* there, and this app's admin screens have the
# same names. The files live under html/console rather than being aliased
# there, so URL and path match segment for segment.
server {
  listen 3000;
  root /usr/share/nginx/html;

  # Hashed asset filenames, so they can be cached indefinitely.
  location /console/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/conf.d/security-headers.inc;
  }

  # Written at container start, so one image serves any issuer.
  location = /console/config.js {
    add_header Cache-Control "no-store";
    include /etc/nginx/conf.d/security-headers.inc;
  }

  # A single-page app: every path under /console is the same document.
  location /console/ {
    try_files $uri $uri/ /console/index.html;
    add_header Cache-Control "no-store";
    include /etc/nginx/conf.d/security-headers.inc;
  }

  # The root is not this app's, but landing there and getting a 404 is a poor
  # welcome — and both the dev server and the production proxy redirect it. Match
  # them, so the same URL behaves the same way in all three.
  location = / {
    return 302 /console/;
  }

  # Anything else genuinely is not this app's to answer. Without this, a stray
  # request would fall through to the root and 404 with nginx's own page; saying
  # so explicitly keeps the container honest when it is run on its own.
  location / {
    return 404;
  }
}
