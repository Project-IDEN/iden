# The models the engine runs, and the thresholds calibrated for them.
#
# `version` is stamped on every template the provider stores. Change any model
# below and bump it: a template from another model is not comparable, so the
# provider stops counting it as enrolled and the person enrols again.
#
# LICENCES. The detector and recogniser are InsightFace's antelopev2 pack, whose
# weights are released for non-commercial research only. The anti-spoofing models
# are Silent-Face's MiniFASNet (Apache-2.0). A deployment that is not research
# replaces the recogniser with weights it is licensed to use — see
# doc/concepts/biometrics.md.

version = "antelopev2-minifasnet-1"

[detector]
file = "antelopev2/scrfd_10g_bnkps.onnx"
sha256 = "5838f7fe053675b1c7a08b633df49e7af5495cee0493c7dcf6697200b85b5b91"
input_size = 640
score_threshold = 0.5

[recognizer]
file = "antelopev2/glintr100.onnx"
sha256 = "4ab1d6435d639628a6f3e5008dd4f929edf4c4124b1a7169e1048f9fef534cdf"
# Pixel normalisation the model was trained with: (x - mean) / std, RGB.
mean = 127.5
std = 127.5
# Cosine similarity at or above which two faces are the same person.
# NOT CALIBRATED: a conservative starting point for ArcFace R100. Run
# `python -m eval.run` on images from your own cameras and write the result here
# with `--write-threshold`; until then `/info` reports `calibrated = false`.
match_threshold = 0.40
calibrated = false

[[anti_spoofing]]
file = "MiniFASNetV2.onnx"
sha256 = "b32929adc2d9c34b9486f8c4c7bc97c1b69bc0ea9befefc380e4faae4e463907"
# How much context around the face the model was trained to see.
crop_scale = 2.7

[[anti_spoofing]]
file = "MiniFASNetV1SE.onnx"
sha256 = "ebab7f90c7833fbccd46d3a555410e78d969db5438e169b6524be444862b3676"
crop_scale = 4.0

[policy]
# Mean live probability across the anti-spoofing models for a frame to count as live.
live_threshold = 0.5
# Share of frontal frames that must count as live.
live_fraction = 0.8

[quality]
# Pixels between the eyes. Below this, too little face to recognise.
min_eye_distance = 40
# Variance of the Laplacian of the aligned 112px face; lower is blurrier.
min_sharpness = 20.0
min_brightness = 50.0
max_brightness = 210.0
# |yaw| beyond this on a frame that should be frontal is `off_angle`.
max_frontal_yaw = 0.3

[liveness]
# Change from the frontal baseline that counts as performing an action. Yaw is
# nose offset over eye distance; pitch is the nose's position between the eyes
# and the mouth.
turn_delta = 0.15
pitch_delta = 0.08
# Share of flash frames whose colour cast must match the colour shown.
flash_min_score = 0.75
# Smallest chroma shift across flash frames that counts as a reaction at all.
flash_min_spread = 0.004
# Every frame must look like the same person as the frontal ones: a lower bar
# for turned heads, whose embeddings drift.
consistency_frontal = 0.5
consistency_turned = 0.25

# Where scripts/fetch_models.py gets the files above. Each archive is verified
# before anything is extracted, and each file again after.
[[source]]
url = "https://github.com/deepinsight/insightface/releases/download/v0.7/antelopev2.zip"
sha256 = "8e182f14fc6e80b3bfa375b33eb6cff7ee05d8ef7633e738d1c89021dcf0c5c5"
extract = ["antelopev2/scrfd_10g_bnkps.onnx", "antelopev2/glintr100.onnx"]

[[source]]
url = "https://github.com/yakhyo/face-anti-spoofing/releases/download/weights/MiniFASNetV2.onnx"
sha256 = "b32929adc2d9c34b9486f8c4c7bc97c1b69bc0ea9befefc380e4faae4e463907"
file = "MiniFASNetV2.onnx"

[[source]]
url = "https://github.com/yakhyo/face-anti-spoofing/releases/download/weights/MiniFASNetV1SE.onnx"
sha256 = "ebab7f90c7833fbccd46d3a555410e78d969db5438e169b6524be444862b3676"
file = "MiniFASNetV1SE.onnx"
