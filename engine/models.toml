# The models the engine runs, and the thresholds calibrated for them.
#
# `version` is stamped on every template the provider stores. Change any model
# below and bump it: a template from another model is not comparable, so the
# provider stops counting it as enrolled and the person enrols again.
#
# LICENCES. Every model here is InsightFace's — the buffalo_l pack and its
# liveness model — and released for non-commercial research only. A deployment
# that is not research replaces them with weights it is licensed to use — see
# doc/concepts/biometrics.md.

version = "buffalo_l-liveness-1"

[detector]
file = "det_10g.onnx"
sha256 = "5838f7fe053675b1c7a08b633df49e7af5495cee0493c7dcf6697200b85b5b91"
# Run at each size, merged by one NMS: 640 finds a face at arm's length or
# further, 96 a face so close it fills the picture.
input_sizes = [96, 640]
score_threshold = 0.5

[recognizer]
file = "w600k_r50.onnx"
sha256 = "4c06341c33c2ca1f86781dab0e829f88ad5b64be9fba56e56bc9ebdefc619e43"
# Pixel normalisation the model was trained with: (x - mean) / std, RGB.
mean = 127.5
std = 127.5
# Cosine similarity at or above which two faces are the same person.
# NOT CALIBRATED: InsightFace measured 0.408 at a false match rate of 1e-6 on
# the ICCV21-MFR multi-racial set. Run `python -m eval.run` on images from your
# own cameras and write the result here with `--write-threshold`; until then
# `/info` reports `calibrated = false`.
match_threshold = 0.41
calibrated = false

[anti_spoofing]
file = "liveness.onnx"
sha256 = "87a9ac1dbb16a61eec212957e5095e62a8769c1e188af9b0198f253302c4afdb"

[policy]
# Live probability for a frame to count as live. InsightFace's default; an
# integration default, not a calibrated one.
live_threshold = 0.8
# Share of frontal frames that must count as live.
live_fraction = 0.8

[quality]
# Pixels between the eyes. Below this, too little face to recognise.
min_eye_distance = 40
# Variance of the Laplacian of the aligned 112px face; lower is blurrier.
min_sharpness = 20.0
min_brightness = 50.0
max_brightness = 210.0
# |yaw| beyond this on a frame that should be frontal is `off_angle`.
max_frontal_yaw = 0.3
# Share of the anti-spoofing crop that may fall outside the picture before a
# frontal frame is `out_of_frame`: too little context around the face to judge.
max_out_of_frame = 0.3

[liveness]
# Change from the frontal baseline that counts as performing an action. Yaw is
# nose offset over eye distance; pitch is the nose's position between the eyes
# and the mouth.
turn_delta = 0.15
pitch_delta = 0.08
# Every frame must look like the same person as the frontal ones: a lower bar
# for turned heads, whose embeddings drift.
consistency_frontal = 0.5
consistency_turned = 0.25

# Where scripts/fetch_models.py gets the files above. Each archive is verified
# before anything is extracted, and each file again after.
[[source]]
url = "https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip"
sha256 = "80ffe37d8a5940d59a7384c201a2a38d4741f2f3c51eef46ebb28218a7b0ca2f"
extract = ["det_10g.onnx", "w600k_r50.onnx"]

[[source]]
url = "https://github.com/deepinsight/insightface-model-addons/releases/download/addons/liveness.onnx"
sha256 = "87a9ac1dbb16a61eec212957e5095e62a8769c1e188af9b0198f253302c4afdb"
file = "liveness.onnx"
