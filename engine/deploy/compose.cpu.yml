# The biometric engine on a machine of its own, on its CPU. Only engine/ needs
# to be on that machine.
#
#   cd engine/deploy && docker compose -f compose.cpu.yml up -d --build
#
# On an NVIDIA GPU, use compose.gpu.yml instead. For an engine on the
# provider's host, see deploy/docker-compose.engine-cpu.yml.
#
# Needs, beside this file: `engine.token`, a copy of the provider's
# provider/keys/engine.token, and the models in ../models
# (`uv run python -m scripts.fetch_models`). See
# doc/operations/biometric-engine.md#on-another-machine.
#
# Plain HTTP: let only the provider's machine reach the port.

name: iden-engine

services:
  engine:
    build:
      context: ..
      target: cpu
    environment:
      ENGINE_ENV: ${ENGINE_ENV:-prod}
      ENGINE_TOKEN_FILE: /secrets/engine.token
      ENGINE_MODEL_DIR: /app/models
      ENGINE_WORKERS: ${ENGINE_WORKERS:-1}
    volumes:
      - ./engine.token:/secrets/engine.token:ro
      - ../models:/app/models:ro
    ports:
      - "${ENGINE_PUBLISH:-8000}:8000"
    restart: unless-stopped
