# The biometric engine on a host of its own — a GPU server, say — apart from
# the provider. On the same host as the provider, deploy/docker-compose.yml
# runs this same service under `--profile biometric` instead.
#
#   cd engine/deploy
#   docker compose up -d                                   # CPU
#   docker compose -f compose.yml -f compose.gpu.yml up -d # NVIDIA GPU
#   ... -f compose.tls.yml                                 # serve TLS itself
#
# Needs, beside this file: `engine.token` (a copy of the provider's
# provider/keys/engine.token), and the models in ../models
# (`uv run python -m scripts.fetch_models`). See
# doc/operations/biometric-engine.md#on-a-host-of-its-own.

name: iden-engine

services:
  engine:
    build:
      context: ..
      target: cpu
    environment:
      ENGINE_ENV: ${ENGINE_ENV:-prod}
      ENGINE_TOKEN_FILE: /secrets/engine.token
      ENGINE_MODEL_DIR: /app/models
      ENGINE_WORKERS: ${ENGINE_WORKERS:-1}
    volumes:
      - ${ENGINE_TOKEN_PATH:-./engine.token}:/secrets/engine.token:ro
      - ../models:/app/models:ro
    # Loopback by default. Publishing it to the network is a decision, made in
    # .env with ENGINE_PUBLISH — and then with TLS in front or compose.tls.yml.
    ports:
      - "${ENGINE_PUBLISH:-127.0.0.1:8000}:8000"
    restart: unless-stopped
