[project]
name = "engine"
version = "1.0.0"
description = "IDEN biometric engine — face detection, quality, anti-spoofing and 1:1 matching"
readme = "README.md"
authors = [
    { name = "yephonekyaw", email = "yephonekyaw231202@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
]

[project.scripts]
engine = "engine.app:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

# onnxruntime comes in one of two builds, never both: they install the same
# `onnxruntime` module. `cpu` is a default group, so a plain `uv sync` or
# `uv run` installs it; an NVIDIA host swaps it with
# `uv sync --no-group cpu --group gpu`. The GPU build has no macOS wheels.
#
# The GPU build is held at 1.26, the last built against CUDA 12. From 1.27 it
# is CUDA 13, which dropped Maxwell, Pascal and Volta — a GTX 10-series card
# included. Move it forward only on hardware from Turing (RTX 20) on.
[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

[dependency-groups]
cpu = ["onnxruntime>=1.31.0"]
gpu = ["onnxruntime-gpu>=1.26.0,<1.27"]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # The formatter owns line length. It will not split a long string or
    # comment, so E501 only ever reports lines ruff itself chose to leave.
    "E501",
    # `File(...)` and `Form(...)` in a parameter default are the FastAPI idiom.
    "B008",
]

[tool.pyright]
include = ["src", "tests", "scripts", "eval"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
