# Runs the biometric engine on an NVIDIA GPU.
#
#   docker compose -f deploy/docker-compose.yml \
#                  -f deploy/docker-compose.gpu.yml --profile biometric up -d
#
# The host needs the NVIDIA driver, 580 or newer (the image carries CUDA 13 and
# cuDNN 9), and the NVIDIA Container Toolkit. Check with:
#
#   docker run --rm --gpus all nvidia/cuda:13.0.3-base-ubuntu24.04 nvidia-smi
#
# ENGINE_DEVICE=cuda makes the engine refuse to start without a GPU rather than
# fall back to the CPU and serve twenty times slower without anyone noticing.

services:
  engine:
    build:
      target: gpu
    environment:
      ENGINE_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
