# Runs the biometric engine on an NVIDIA GPU.
#
#   docker compose -f deploy/docker-compose.yml \
#                  -f deploy/docker-compose.gpu.yml --profile biometric up -d
#
# The host needs an NVIDIA GPU from Pascal (GTX 10) on, a driver new enough for
# CUDA 12.9 (575 or later), and the NVIDIA Container Toolkit. The image carries
# CUDA 12.9 and cuDNN 9. Check with:
#
#   docker run --rm --gpus all nvidia/cuda:12.9.1-base-ubuntu24.04 nvidia-smi
#
# ENGINE_DEVICE=cuda makes the engine refuse to start without a GPU rather than
# fall back to the CPU and serve twenty times slower without anyone noticing.

services:
  engine:
    build:
      target: gpu
    environment:
      ENGINE_DEVICE: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
