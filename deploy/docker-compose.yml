# The IDEN provider, the two stores it needs, and the two browser frontends.
#
# `docker compose -f deploy/docker-compose.yml up --build` brings up a working
# deployment: migrations run to completion, then the provider starts.
#
# Alone, this file publishes each service on loopback and is a development
# deployment. To put it on the internet, add the tunnel overlay:
#
#   docker compose -f deploy/docker-compose.yml \
#                  -f deploy/docker-compose.tunnel.yml up -d
#
# which adds nginx in front and cloudflared around it — no inbound port, one
# origin. See doc/operations/cloudflare-tunnel.md.

name: iden-dev

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: iden
      # Defaulted so `up` with no .env still works on a laptop, and named here so
      # a deployment can set it. It was fixed at `iden` before, which meant the
      # database of a deployment on the internet was protected by a password
      # published in this file. See deploy/.env.example.
      POSTGRES_PASSWORD: ${IDEN_POSTGRES_PASSWORD:-iden}
      POSTGRES_DB: iden
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iden -d iden"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # Redis holds every live session, and a session id is the cookie — so read
    # access to it is read access to every signed-in account. cloudflared shares
    # this network and is a third-party image.
    command:
      ["redis-server", "--requirepass", "${IDEN_REDIS_PASSWORD:-iden}", "--save", "60", "1"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${IDEN_REDIS_PASSWORD:-iden}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Blob storage for profile photos. The provider speaks the S3 API and nothing
  # else, so MinIO, Garage or AWS S3 are drop-in replacements. SeaweedFS is the
  # default because it is Apache-2.0 and runs as a single process.
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-dir=/data", "-s3"]
    # From the environment rather than a mounted `s3.config`, so the credential
    # is one value in deploy/.env instead of a secret committed here and a copy
    # beside the provider that could drift. With no config file SeaweedFS takes
    # these as its single admin identity and refuses anonymous access.
    environment:
      AWS_ACCESS_KEY_ID: ${IDEN_S3_ACCESS_KEY:-iden}
      AWS_SECRET_ACCESS_KEY: ${IDEN_S3_SECRET_KEY:-idensecret}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      # The S3 port, because that is the only one the provider talks to. By
      # address rather than by name: `localhost` resolves to ::1 in this image
      # and nothing listens there.
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8333/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs to completion and exits. A separate service rather than an entrypoint
  # step so that scaling the provider to two replicas does not run the
  # migrations twice, concurrently, against the same database.
  migrate:
    build:
      context: ../provider
    command: ["alembic", "upgrade", "head"]
    # Two kinds of value below, and only the first is yours.
    #
    #   ${...}  Deployment settings, from deploy/.env. Edit that, not this file,
    #           so an upgrade never conflicts with your hostname. Every default
    #           is a laptop, so `up` with no .env still works.
    #   plain   Wiring defined by this file — `postgres`, `/keys`. Change one and
    #           it stops resolving.
    environment: &provider-env
      IDEN_ENV: ${IDEN_ENV:-dev}
      IDEN_ISSUER: ${IDEN_ISSUER:-http://localhost:8000}
      IDEN_AUTH_UI_BASE_URL: ${IDEN_AUTH_UI_BASE_URL:-http://localhost:4000}
      IDEN_ALLOWED_ADMIN_ORIGINS: '${IDEN_ALLOWED_ADMIN_ORIGINS:-["http://localhost:3000","http://localhost:5173","http://localhost:5100"]}'
      # The provider reads the organization name too: it is what an
      # authenticator app files someone's second factor under.
      IDEN_ORG_NAME: ${IDEN_ORG_NAME:-}
      # Whose X-Forwarded-For is believed. Empty here because nothing is in
      # front; the tunnel overlay names the network nginx proxies from.
      IDEN_FORWARDED_ALLOW_IPS: ${IDEN_FORWARDED_ALLOW_IPS:-}
      # Read by `scripts.seed`, and only when it creates the account.
      #
      # The password is deliberately absent: a value here would sit in the
      # container's environment, where `docker inspect` reads it, to save typing
      # one once. Let the seed generate it, or pass it to that command alone:
      #   docker compose exec -e IDEN_BOOTSTRAP_ADMIN_PASSWORD=... provider \
      #     python -m scripts.seed
      IDEN_BOOTSTRAP_ADMIN_EMAIL: ${IDEN_BOOTSTRAP_ADMIN_EMAIL:-admin@localhost}

      IDEN_DATABASE_URL: postgresql+asyncpg://iden:${IDEN_POSTGRES_PASSWORD:-iden}@postgres:5432/iden
      IDEN_REDIS_URL: redis://:${IDEN_REDIS_PASSWORD:-iden}@redis:6379/0
      IDEN_SIGNING_KEY_DIR: /keys
      IDEN_S3_ENDPOINT_URL: http://seaweedfs:8333
      IDEN_S3_ACCESS_KEY: ${IDEN_S3_ACCESS_KEY:-iden}
      IDEN_S3_SECRET_KEY: ${IDEN_S3_SECRET_KEY:-idensecret}
      IDEN_S3_BUCKET: iden
      IDEN_S3_REGION: ${IDEN_S3_REGION:-us-east-1}

      # Everything else the provider reads, so that setting one in deploy/.env
      # does what it looks like it does. A container only ever receives what is
      # named here, so a setting left off this list is not defaulted — it is
      # ignored, and only under Compose, which is the confusing half.
      #
      # `IDEN_BOOTSTRAP_ADMIN_PASSWORD` is the one deliberate omission; see above.
      IDEN_LOG_LEVEL: ${IDEN_LOG_LEVEL:-info}
      IDEN_API_PREFIX: ${IDEN_API_PREFIX:-}
      IDEN_AVATAR_MAX_BYTES: ${IDEN_AVATAR_MAX_BYTES:-5242880}
      IDEN_SIGNING_ALGORITHM: ${IDEN_SIGNING_ALGORITHM:-RS256}
      # Empty means `totp.key` beside the signing keys, which is /keys above.
      IDEN_TOTP_KEY_FILE: ${IDEN_TOTP_KEY_FILE:-}
      IDEN_ACCESS_TOKEN_TTL: ${IDEN_ACCESS_TOKEN_TTL:-600}
      IDEN_ID_TOKEN_TTL: ${IDEN_ID_TOKEN_TTL:-600}
      IDEN_REFRESH_TOKEN_TTL: ${IDEN_REFRESH_TOKEN_TTL:-2592000}
      IDEN_AUTH_CODE_TTL: ${IDEN_AUTH_CODE_TTL:-60}
      IDEN_SESSION_TTL: ${IDEN_SESSION_TTL:-86400}
      IDEN_CHALLENGE_TTL: ${IDEN_CHALLENGE_TTL:-600}
      IDEN_REFRESH_GRACE_PERIOD: ${IDEN_REFRESH_GRACE_PERIOD:-30}
      IDEN_RATE_LIMIT_ENABLED: ${IDEN_RATE_LIMIT_ENABLED:-true}
      IDEN_DEVELOPER_MAX_CLIENTS: ${IDEN_DEVELOPER_MAX_CLIENTS:-5}
      IDEN_BIOMETRIC_ENABLED: ${IDEN_BIOMETRIC_ENABLED:-false}
      IDEN_ENGINE_BASE_URL: ${IDEN_ENGINE_BASE_URL:-http://engine:8000}
    volumes: &provider-volumes
      # Written by `uv run python -m scripts.gen_keys`, read-only inside. The
      # whole directory: `totp.key` lives here too, and it is what makes a stolen
      # database dump inert rather than everyone's second factor.
      - ../provider/keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy

  provider:
    build:
      context: ../provider
    environment: *provider-env
    volumes: *provider-volumes
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  # Static builds. The issuer and branding are written into /config.js at
  # container start, so the same image serves any deployment.
  auth-ui:
    build:
      context: ../web
      dockerfile: auth-ui/Dockerfile
    environment:
      IDEN_ISSUER: ${IDEN_ISSUER:-http://localhost:8000}
      IDEN_ORG_NAME: ${IDEN_ORG_NAME:-}
      IDEN_ORG_LOGO_URL: ${IDEN_ORG_LOGO_URL:-}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      provider:
        condition: service_started

  dashboard:
    build:
      context: ../web
      dockerfile: dashboard/Dockerfile
    environment:
      IDEN_ISSUER: ${IDEN_ISSUER:-http://localhost:8000}
      IDEN_ORG_NAME: ${IDEN_ORG_NAME:-}
      IDEN_ORG_LOGO_URL: ${IDEN_ORG_LOGO_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      provider:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
