# The IDEN provider, the two stores it needs, and the two browser frontends.
#
# `docker compose -f deploy/docker-compose.yml up --build` brings up a working
# deployment: migrations run to completion, then the provider starts.
#
# Alone, this file publishes each service on loopback and is a development
# deployment. To put it on the internet, add the tunnel overlay:
#
#   docker compose -f deploy/docker-compose.yml \
#                  -f deploy/docker-compose.tunnel.yml up -d
#
# which adds nginx in front and cloudflared around it — no inbound port, one
# origin. See doc/operations/cloudflare-tunnel.md.

name: iden-dev

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: iden
      # Defaulted so `up` with no .env still works on a laptop, and named here so
      # a deployment can set it. It was fixed at `iden` before, which meant the
      # database of a deployment on the internet was protected by a password
      # published in this file. See deploy/.env.example.
      POSTGRES_PASSWORD: ${IDEN_POSTGRES_PASSWORD:-iden}
      POSTGRES_DB: iden
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iden -d iden"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    # Redis holds every live session and every login challenge, and it had no
    # password: anything that could reach the network could read them. The only
    # other things on this network are nginx and cloudflared, which is to say a
    # third-party image — so this is the difference between compromising that
    # container and compromising every session in the deployment.
    command:
      ["redis-server", "--requirepass", "${IDEN_REDIS_PASSWORD:-iden}", "--save", "60", "1"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${IDEN_REDIS_PASSWORD:-iden}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Blob storage for profile photos, and later the biometric module's
  # enrollment images. The provider speaks the S3 API and nothing else, so this
  # is swappable for MinIO, Garage, or AWS S3 by changing IDEN_S3_ENDPOINT_URL
  # and the credentials. SeaweedFS is the default because it is Apache-2.0 and
  # runs as a single process.
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-dir=/data", "-s3"]
    # The credential comes from the environment rather than a mounted
    # `s3.config` file, so it is one value set in deploy/.env instead of a secret
    # committed to this repository and a copy of it beside the provider that
    # could drift out of step. With no config file SeaweedFS takes these as its
    # single admin identity and refuses anonymous access.
    environment:
      AWS_ACCESS_KEY_ID: ${IDEN_S3_ACCESS_KEY:-iden}
      AWS_SECRET_ACCESS_KEY: ${IDEN_S3_SECRET_KEY:-idensecret}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      # The S3 port, because that is the only one the provider talks to. By
      # address rather than by name: `localhost` resolves to ::1 in this image
      # and nothing listens there.
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:8333/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs to completion and exits. A separate service rather than an entrypoint
  # step so that scaling the provider to two replicas does not run the
  # migrations twice, concurrently, against the same database.
  migrate:
    build:
      context: ../provider
    command: ["alembic", "upgrade", "head"]
    # Two kinds of value below, and only the first is yours.
    #
    #   ${...}  Deployment settings. They come from deploy/.env — copy
    #           .env.example and edit that, not this file, so an upgrade never
    #           conflicts with your hostname. Each default is a laptop, which
    #           is why `up` with no .env at all still works.
    #
    #   plain   Wiring. Service names and mount points defined by this very
    #           file: `postgres` is the service above, `/keys` is the volume
    #           below. Nothing to configure here — change one and it stops
    #           resolving.
    environment: &provider-env
      IDEN_ENV: ${IDEN_ENV:-dev}
      IDEN_ISSUER: ${IDEN_ISSUER:-http://localhost:8000}
      IDEN_AUTH_UI_BASE_URL: ${IDEN_AUTH_UI_BASE_URL:-http://localhost:4000}
      IDEN_ALLOWED_ADMIN_ORIGINS: '${IDEN_ALLOWED_ADMIN_ORIGINS:-["http://localhost:3000","http://localhost:5173","http://localhost:5100"]}'
      # The provider reads the organization name too: it is what an
      # authenticator app files someone's second factor under.
      IDEN_ORG_NAME: ${IDEN_ORG_NAME:-}
      # Whose X-Forwarded-For is believed. Empty here because nothing is in
      # front; the tunnel overlay names the network nginx proxies from.
      IDEN_FORWARDED_ALLOW_IPS: ${IDEN_FORWARDED_ALLOW_IPS:-}
      # Read by `scripts.seed`, and only when it creates the account: against an
      # administrator that already exists the seed changes nothing.
      #
      # The matching password is deliberately absent. A value here would live in
      # the container's environment for as long as the container does, readable
      # by `docker inspect`, to save typing a password once. Let the seed
      # generate one, or pass it to that single command:
      #   docker compose exec -e IDEN_BOOTSTRAP_ADMIN_PASSWORD=... provider \
      #     python -m scripts.seed
      IDEN_BOOTSTRAP_ADMIN_EMAIL: ${IDEN_BOOTSTRAP_ADMIN_EMAIL:-admin@localhost}

      IDEN_DATABASE_URL: postgresql+asyncpg://iden:${IDEN_POSTGRES_PASSWORD:-iden}@postgres:5432/iden
      IDEN_REDIS_URL: redis://:${IDEN_REDIS_PASSWORD:-iden}@redis:6379/0
      IDEN_SIGNING_KEY_DIR: /keys
      IDEN_S3_ENDPOINT_URL: http://seaweedfs:8333
      IDEN_S3_ACCESS_KEY: ${IDEN_S3_ACCESS_KEY:-iden}
      IDEN_S3_SECRET_KEY: ${IDEN_S3_SECRET_KEY:-idensecret}
      IDEN_S3_BUCKET: iden
    volumes: &provider-volumes
      # Generated on the host with `uv run python -m scripts.gen_keys`, and
      # read-only inside: the provider signs with these and never writes them.
      # The whole directory, not just the PEMs — `totp.key` lives here too, and
      # it is what makes a stolen database dump inert rather than a working
      # second factor for everyone enrolled.
      - ../provider/keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy

  provider:
    build:
      context: ../provider
    environment: *provider-env
    volumes: *provider-volumes
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  # The two browser applications. Both are static builds: the issuer and the
  # organization's branding are written into /config.js at container start, so
  # the same image serves any deployment. Set IDEN_ORG_NAME to the organization
  # people think they are signing in to; it takes the larger type and IDEN drops
  # to a caption beneath it. IDEN_ORG_LOGO_URL is optional and sits beside it.
  auth-ui:
    build:
      context: ../web
      dockerfile: auth-ui/Dockerfile
    environment:
      IDEN_ISSUER: ${IDEN_ISSUER:-http://localhost:8000}
      IDEN_ORG_NAME: ${IDEN_ORG_NAME:-}
      IDEN_ORG_LOGO_URL: ${IDEN_ORG_LOGO_URL:-}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      provider:
        condition: service_started

  dashboard:
    build:
      context: ../web
      dockerfile: dashboard/Dockerfile
    environment:
      IDEN_ISSUER: ${IDEN_ISSUER:-http://localhost:8000}
      IDEN_ORG_NAME: ${IDEN_ORG_NAME:-}
      IDEN_ORG_LOGO_URL: ${IDEN_ORG_LOGO_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      provider:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
