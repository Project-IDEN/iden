# The biometric engine on the provider's host, on an NVIDIA GPU. Added to the
# main file rather than run on its own, so it joins the provider's network:
#
#   docker compose -f deploy/docker-compose.yml \
#                  -f deploy/docker-compose.engine-gpu.yml up -d --build
#
# with IDEN_BIOMETRIC_ENABLED=true in deploy/.env. Without a GPU, use
# docker-compose.engine-cpu.yml instead.
#
# The host needs an NVIDIA GPU from Pascal (GTX 10) on, a driver new enough for
# CUDA 12.9 (575 or later), and the NVIDIA Container Toolkit. Check with:
#
#   docker run --rm --gpus all nvidia/cuda:12.9.1-base-ubuntu24.04 nvidia-smi
#
# No published port: only the provider reaches it, at http://engine:8000,
# presenting the token from provider/keys. Models are fetched once into
# engine/models.

services:
  engine:
    build:
      context: ../engine
      target: gpu
    environment:
      ENGINE_ENV: ${IDEN_ENV:-dev}
      ENGINE_TOKEN_FILE: /secrets/engine.token
      ENGINE_MODEL_DIR: /app/models
      ENGINE_WORKERS: ${IDEN_ENGINE_WORKERS:-1}
      # Refuse to start without a GPU rather than fall back to the CPU and
      # serve twenty times slower without anyone noticing.
      ENGINE_DEVICE: cuda
    volumes:
      - ../provider/keys/engine.token:/secrets/engine.token:ro
      - ../engine/models:/app/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
