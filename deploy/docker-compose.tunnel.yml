# Makes deploy/docker-compose.yml reachable from the internet without opening a
# single inbound port.
#
#   docker compose -f deploy/docker-compose.yml \
#                  -f deploy/docker-compose.tunnel.yml up -d
#
# Two services do it. nginx puts the provider and both frontends on one origin
# and does the work the application cannot — flood protection, upload limits,
# and telling the provider who the caller is. cloudflared holds an outbound
# connection to Cloudflare's edge, which is what carries traffic back in.
#
# Walk through doc/operations/cloudflare-tunnel.md before the first run; the
# settings on the Cloudflare side matter as much as the ones here.

services:
  # The stores' credentials are required here rather than defaulted. The base
  # file falls back to values it publishes, and Compose applies that fallback to
  # an empty value too — so a deploy/.env copied from the example with a line
  # left blank would start a public deployment on `iden`. Failing before `up`
  # matters because PostgreSQL and SeaweedFS keep the credential they first
  # initialised their volume with.
  postgres:
    environment:
      POSTGRES_PASSWORD: ${IDEN_POSTGRES_PASSWORD:?set IDEN_POSTGRES_PASSWORD in deploy/.env}

  redis:
    command:
      [
        "redis-server",
        "--requirepass",
        "${IDEN_REDIS_PASSWORD:?set IDEN_REDIS_PASSWORD in deploy/.env}",
        "--save",
        "60",
        "1",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${IDEN_REDIS_PASSWORD}", "ping"]

  seaweedfs:
    environment:
      AWS_ACCESS_KEY_ID: ${IDEN_S3_ACCESS_KEY:?set IDEN_S3_ACCESS_KEY in deploy/.env}
      AWS_SECRET_ACCESS_KEY: ${IDEN_S3_SECRET_KEY:?set IDEN_S3_SECRET_KEY in deploy/.env}

  nginx:
    image: nginx:1.31-alpine
    volumes:
      # Copy nginx/iden.conf.example to nginx/iden.conf and edit that. Mounted
      # over default.conf so the image's own server block, which also listens
      # on 80, is gone rather than competing for requests.
      - ./nginx/iden.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy.inc:/etc/nginx/conf.d/proxy.inc:ro
    # Loopback only, and only so the proxy can be exercised without going out
    # to Cloudflare and back:
    #   curl -H 'Host: iden.example.org' http://127.0.0.1:8080/.well-known/openid-configuration
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      provider:
        condition: service_started
      auth-ui:
        condition: service_started
      dashboard:
        condition: service_started
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    # `run` with a token needs no config file and no mounted credentials: the
    # token names the tunnel and carries its secret, and the ingress rules live
    # in the Cloudflare dashboard. Point the tunnel's public hostname at
    # http://nginx:80 there.
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in deploy/.env}
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

# A fixed subnet so the address nginx trusts is knowable in advance. Left to
# Docker it is assigned at creation time and changes between hosts, which would
# make `set_real_ip_from` a value you have to look up and keep in step.
#
# Change it if it collides with something on your network — and change
# set_real_ip_from in nginx/iden.conf to match, or the proxy stops believing
# cloudflared and every caller looks like the tunnel.
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.250.0/24
