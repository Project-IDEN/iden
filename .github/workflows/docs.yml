name: Documentation

on:
  push:
    branches: [dev]
    paths:
      - doc/**
      - zensical.toml
      - provider/pyproject.toml
      - provider/uv.lock
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - doc/**
      - zensical.toml
      - provider/pyproject.toml
      - provider/uv.lock
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: true

      - name: Build
        run: uv run --project provider zensical build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
