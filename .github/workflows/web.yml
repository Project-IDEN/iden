name: Frontends

on:
  push:
    branches: [dev]
    paths:
      - web/**
      - .github/workflows/web.yml
  pull_request:
    paths:
      - web/**
      - .github/workflows/web.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      # v6.0.10, pinned by commit like the other third-party action in
      # this repository.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          # The version comes from "packageManager" in the workspace manifest, so
          # CI and a developer's machine cannot drift. This path is relative to
          # the repository root: `defaults.run.working-directory` applies to
          # `run` steps only, never to an action's own file lookups.
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          # Matches the Dockerfile that builds these apps for deployment.
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build
