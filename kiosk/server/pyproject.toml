[project]
name = "kiosk-server"
version = "0.1.0"
description = "The IDEN enrolment kiosk: holds the device credentials, serves its UI, and talks to IDEN."
authors = [
    { name = "yephonekyaw", email = "yephonekyaw231202@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
]

[project.scripts]
kiosk-server = "kiosk_server.app:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # The formatter owns line length. It will not split a long string or
    # comment, so E501 only ever reports lines ruff itself chose to leave.
    "E501",
    # `File(...)` and `Form(...)` in a parameter default are the FastAPI idiom.
    "B008",
]

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
