# The kiosk server. install.sh copies this to /opt/iden-kiosk and writes the
# .env beside it; `iden-kiosk` runs it from there.
name: iden-kiosk

services:
  kiosk:
    image: ${KIOSK_IMAGE:?set KIOSK_IMAGE in .env}
    restart: unless-stopped
    environment:
      KIOSK_ISSUER: ${KIOSK_ISSUER:?set KIOSK_ISSUER in .env}
    # Loopback only: the one browser that should reach it is on this device.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - credentials:/data
    # A kiosk runs for months on an SD card; keep its log from filling it.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  # The kiosk's client secret. Survives image updates; `iden-kiosk unpair`
  # deletes it.
  credentials:
