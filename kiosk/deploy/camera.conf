# V4L2 controls applied to the kiosk camera when it is plugged in and at boot.
#
# Automatic white balance and exposure undo the colour flashes the liveness
# check depends on, and autofocus hunting mid-capture blurs frames. Lock them.
#
# Control names and ranges differ between cameras. Before trusting these, list
# what yours has and tune the values in the light the kiosk will have:
#
#     v4l2-ctl -d /dev/video0 --list-ctrls-menus
#
# One `name=value` per line. A control the camera lacks is skipped with a warning.

# 1 = 50 Hz mains, 2 = 60 Hz: matching it stops fluorescent lights flickering.
power_line_frequency=1

white_balance_automatic=0
white_balance_temperature=4600

# 1 = manual. Raise exposure_time_absolute if the picture is dark.
auto_exposure=1
exposure_time_absolute=250

focus_automatic_continuous=0
# An arm's length away.
focus_absolute=30
