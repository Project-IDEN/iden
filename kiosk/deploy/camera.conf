# The kiosk camera's settings, held for as long as it is plugged in. Saving this
# file applies it within a second, so tune with the kiosk app on screen.
#
# Nothing is set until you uncomment it, and the camera runs on its automatic
# settings until then. Automatic exposure and focus can darken or blur a
# capture — tune them before the kiosk is used. The guide:
# doc/operations/kiosk-camera.md.
#
# Names, ranges and units differ between cameras. See what this one has with:
#
#     iden-kiosk camera
#
# One `name=value` per line, applied in this order. A name the camera does not
# have is skipped and logged (iden-kiosk logs camera).

# Mains frequency, so lights do not flicker in the picture: 1 = 50 Hz, 2 = 60 Hz.
# power_line_frequency=1

# White balance, optional: the engine does not depend on colour. Fix it only if
# skin looks orange or blue and keeps shifting. Switch automatic off, then set
# the colour temperature (Kelvin). Older kernels name these
# white_balance_temperature_auto and white_balance_temperature.
# white_balance_automatic=0
# white_balance_temperature=4600

# Exposure: 1 = manual (3 is automatic), then the exposure time in units of
# 100 µs. Older kernels: exposure_auto, exposure_absolute.
# auto_exposure=1
# exposure_time_absolute=250
# Keep the frame rate steady in dim light. Older kernels: exposure_auto_priority.
# exposure_dynamic_framerate=0

# Focus, on a camera that has it: switch autofocus off, then fix the distance.
# The scale is the camera's own. Older kernels: focus_auto.
# focus_automatic_continuous=0
# focus_absolute=30
