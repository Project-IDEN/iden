# Commit-time gate for the provider. Install once, per clone:
#
#     uv run --project provider pre-commit install
#
# The suite is deliberately absent. `uv run pytest` needs PostgreSQL and Redis
# up and takes ~13s; a gate that fails because Docker is not running teaches
# people to pass --no-verify, and a hook everyone bypasses is worse than none.
# Tests belong to CI, or to `pre-commit install --hook-type pre-push`.
#
# Scoped per package: provider/, engine/ and kiosk/server/ each carry their own
# lint and type configuration.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --project provider ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^provider/
        require_serial: true

      - id: ruff-check
        name: ruff check
        entry: uv run --project provider ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        files: ^provider/
        require_serial: true

      # No filenames: pyright reads its include list from provider/pyproject.toml,
      # and a type error is rarely in the file that introduced it.
      - id: pyright
        name: pyright
        entry: bash -c 'cd provider && uv run pyright'
        language: system
        types_or: [python, pyi]
        files: ^provider/
        pass_filenames: false
        require_serial: true

      - id: engine-ruff-format
        name: ruff format (engine)
        entry: uv run --project engine ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^engine/
        require_serial: true

      - id: engine-ruff-check
        name: ruff check (engine)
        entry: uv run --project engine ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        files: ^engine/
        require_serial: true

      - id: engine-pyright
        name: pyright (engine)
        entry: bash -c 'cd engine && uv run pyright'
        language: system
        types_or: [python, pyi]
        files: ^engine/
        pass_filenames: false
        require_serial: true

      - id: kiosk-ruff-format
        name: ruff format (kiosk)
        entry: uv run --project kiosk/server ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^kiosk/server/
        require_serial: true

      - id: kiosk-ruff-check
        name: ruff check (kiosk)
        entry: uv run --project kiosk/server ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        files: ^kiosk/server/
        require_serial: true

      - id: kiosk-pyright
        name: pyright (kiosk)
        entry: bash -c 'cd kiosk/server && uv run pyright'
        language: system
        types_or: [python, pyi]
        files: ^kiosk/server/
        pass_filenames: false
        require_serial: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      # Syntax only: compose files use tags such as `!reset` a loader cannot build.
      - id: check-yaml
        args: [--unsafe]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1024]
